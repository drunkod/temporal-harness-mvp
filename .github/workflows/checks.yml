name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docs-and-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type check
        run: ./node_modules/.bin/tsc --noEmit -p tsconfig.json
      - name: Check documentation and checker fixtures
        run: |
          node scripts/check-docs.mjs --all
          node --test tests/check-docs.test.mjs
      - name: Build and test bounded local policy fixtures
        run: |
          npm run build
          node --test tests/flowdeck-pilot-budget.test.mjs
